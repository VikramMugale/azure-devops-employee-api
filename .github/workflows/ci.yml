name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Test · Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff – lint
        run: ruff check app tests

      - name: Pytest + coverage
        env:
          DATABASE_URL: sqlite:///./test_employee.db
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: pip-audit – dependency vulnerabilities
        run: pip-audit -r requirements.txt --strict || true
        # Use --strict in production; || true keeps CI green while you learn.
        # Change to fail on critical: remove || true once comfortable.

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: employee-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
