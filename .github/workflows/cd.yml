name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only deploy after CI succeeds on the same commit
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build · Push · Deploy to Azure
    runs-on: ubuntu-latest
    # Require CI workflow success on the same commit (optional gate)
    # if: github.event_name == 'workflow_dispatch' || true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          # CHANGE_ME: Create a service principal and store the JSON as a GitHub secret.
          # az ad sp create-for-rbac --name "github-actions-employee-api" \
          #   --role contributor --scopes /subscriptions/<SUB_ID> --sdk-auth
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          # CHANGE_ME: Set ACR_NAME as a GitHub repository variable or secret
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ACR_NAME}.azurecr.io/employee-api:${IMAGE_TAG}"
          IMAGE_LATEST="${ACR_NAME}.azurecr.io/employee-api:latest"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          # CHANGE_ME: Set APP_NAME as a GitHub repository variable
          app-name: ${{ vars.APP_NAME }}
          images: ${{ env.IMAGE }}

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`${{ vars.APP_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
